  namespace: Virtufin.Api.HealthChecks
  summary: >-
    Retry + circuit breaker for the gateway's <b>direct gRPC</b> calls to

    backend services — i.e. <code>Gateway.Invoke</code> and <code>Gateway.InvokeJson</code>,

    which route through <code>GrpcChannelPool</code> and never touch a Dapr sidecar.


    <p>

    This was previously called <code>DaprResiliencePipeline</code>, with

    <code>DAPR_*</code> environment variables, which was actively misleading: it has

    never wrapped a Dapr SDK call. Both call sites wrap

    <code>ExecuteCallAsync</code> on the reflection service. An architecture review

    initially read the pair as duplicating Dapr's own resiliency building

    block; they are in fact disjoint.

    </p>


    <p>

    Resilience for the sidecar's calls out to Dapr components (statestore,

    pubsub) is declared separately, as a Dapr <code>Resiliency</code> resource in

    <code>helm/templates/resiliency.yaml</code>. Keep the two sets of numbers in

    step so both paths degrade the same way.

    </p>


    Constants are configurable via <xref href="Virtufin.Api.Configuration.GatewayResilienceOptions" data-throw-if-not-resolved="false"></xref>

    (env-var-driven).
