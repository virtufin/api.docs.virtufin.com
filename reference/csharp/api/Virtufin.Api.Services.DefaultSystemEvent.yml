  summary: >-
    Default values for the CloudEvents v1.0 envelope that the API

    applies when a <code>PublishSystemEvent</code> call omits the

    <code>ce-source</code> or <code>ce-type</code> metadata. Most callers

    (WebSocketManager, WorkManager) provide their own source URN

    and event type; these defaults exist so the API still produces a

    well-formed CloudEvent when callers don't.
