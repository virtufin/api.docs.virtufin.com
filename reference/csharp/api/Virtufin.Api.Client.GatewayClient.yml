    Implements the request-reply pattern over pub/sub using correlation IDs,

    via the shared per-reply-topic reader started by <xref href="Virtufin.Api.Client.GatewayClient.EnsureReplyReader(System.String)" data-throw-if-not-resolved="false"></xref>

