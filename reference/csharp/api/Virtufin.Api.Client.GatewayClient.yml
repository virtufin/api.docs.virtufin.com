  assemblies:
  - Virtufin.Api.Client
  namespace: Virtufin.Api.Client
  summary: >-
    Dynamic proxy for the API Gateway. Service names are accessed as properties,

    and backend RPC methods are called dynamically on the returned ServiceClient.


    <code>client.Gateway.workmanager</code> triggers <xref href="Virtufin.Api.Client.GatewayClient.TryGetMember(System.Dynamic.GetMemberBinder%2cSystem.Object%40)" data-throw-if-not-resolved="false"></xref>,

    which creates or returns a cached <xref href="Virtufin.Api.Client.ServiceClient" data-throw-if-not-resolved="false"></xref> for "workmanager".

    <code>service.ListWorkers()</code> triggers <xref href="Virtufin.Api.Client.ServiceClient.TryGetMember(System.Dynamic.GetMemberBinder%2cSystem.Object%40)" data-throw-if-not-resolved="false"></xref>,

    which returns a callable that invokes via the Gateway's InvokeJson RPC.


    Provides service discovery, method listing, invocation, publishing, and streaming capabilities.
  example:
  - >-
    <pre><code class="lang-csharp">using var client = new ApiClient();

    var workers = await client.Gateway.workmanager.ListWorkers();

    // Equivalent to:

    var workers = await client.InvokeAsync("workmanager", "ListWorkers");</code></pre>
