    parameters:
    - id: topic
      type: System.String
      description: The topic to publish the request to.
    - id: data
      type: System.Byte[]
      description: The request data as bytes.
    - id: replyTopic
      type: System.String
      description: The topic to listen for responses on.
    - id: timeout
      type: System.Nullable{System.TimeSpan}
      description: 'Maximum time to wait for a response (default: 30s).'
    - id: metadata
      type: System.Collections.Generic.Dictionary{System.String,System.String}
      description: Optional additional metadata to include.
    - id: correlationId
      type: System.String
      description: Optional correlation ID (auto-generated if null).
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancellation token.
