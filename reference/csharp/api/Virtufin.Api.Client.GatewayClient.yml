  assemblies:
  - Virtufin.Api.Client
  namespace: Virtufin.Api.Client
  summary: Invokes a method on a service asynchronously.
  remarks: >-
    The polymorphic <code>Dictionary&lt;string, object?&gt;</code>

    payload is (de)serialized via <xref href="Virtufin.Api.Client.GatewayClient.JsonOptions" data-throw-if-not-resolved="false"></xref>,

    which sets an explicit <xref href="System.Text.Json.Serialization.Metadata.DefaultJsonTypeInfoResolver" data-throw-if-not-resolved="false"></xref>

    so reflection-based dispatch works regardless of the

    process-wide <code>IsReflectionEnabledByDefault</code> flag.

    See <xref href="Virtufin.Api.Client.GatewayClient.JsonOptions" data-throw-if-not-resolved="false"></xref> for the AOT caveat.
