  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Auth
  summary: >-
    Server interceptor enforcing <code>x-api-key</code> authentication on every gRPC

    call (including JSON-transcoded ones) when <xref href="Virtufin.Api.Auth.ApiKeyAuthOptions.Enabled" data-throw-if-not-resolved="false"></xref>.

    Health-check methods stay open so probes and load balancers keep working, and

    so do the Dapr sidecar's own app callbacks (see

    <xref href="Virtufin.Api.Auth.ApiKeyInterceptor.DaprAppCallbackPrefix" data-throw-if-not-resolved="false"></xref>).
