  summary: Server-side handler for intercepting an incoming unary call.
  example: []
  syntax:
    content: 'public override Task<TResponse> UnaryServerHandler<TRequest, TResponse>(TRequest request, ServerCallContext context, UnaryServerMethod<TRequest, TResponse> continuation) where TRequest : class where TResponse : class'
    parameters:
    - id: request
      type: '{TRequest}'
      description: The request value of the incoming invocation.
    - id: context
      type: Grpc.Core.ServerCallContext
      description: >-
        An instance of <xref href="Grpc.Core.ServerCallContext" data-throw-if-not-resolved="false"></xref> representing

        the context of the invocation.
    - id: continuation
      type: Grpc.Core.UnaryServerMethod{{TRequest},{TResponse}}
      description: >-
        A delegate that asynchronously proceeds with the invocation, calling

        the next interceptor in the chain, or the service request handler,

        in case of the last interceptor and return the response value of

        the RPC. The interceptor can choose to call it zero or more times

        at its discretion.
    typeParameters:
    - id: TRequest
      description: Request message type for this method.
    - id: TResponse
      description: Response message type for this method.
    return:
      type: System.Threading.Tasks.Task{{TResponse}}
      description: >-
        A future representing the response value of the RPC. The interceptor

        can simply return the return value from the continuation intact,

        or an arbitrary response value as it sees fit.
