  summary: >-
    Core auth decision, separated from <xref href="Grpc.Core.ServerCallContext" data-throw-if-not-resolved="false"></xref> for testability.

    Returns the authenticated key name, or null when the call is allowed without a

    key (auth disabled or exempt method). Throws <xref href="Grpc.Core.RpcException" data-throw-if-not-resolved="false"></xref>

    (Unauthenticated) when a required key is missing or invalid.
