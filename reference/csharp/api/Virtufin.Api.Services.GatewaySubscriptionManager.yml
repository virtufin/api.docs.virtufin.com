  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    In-process broadcast broker for the <code>Gateway.Subscribe</code> RPC.

    One broker per topic; multiple gRPC callers on the same topic all

    receive every message via <xref href="Virtufin.Api.Services.GatewaySubscriptionManager.BroadcastToTopicAsync(System.String%2cSystem.String%2cSystem.String%2cSystem.String%2cSystem.String%2cSystem.String%2cSystem.Byte%5b%5d%2cSystem.String%2cSystem.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Per the Pub/Sub Topics spec §Subscription Implementation Pattern:

    one Dapr subscription per topic per API process (managed by

    <xref href="Virtufin.Api.Services.TopicDaprSubscriptionRegistry" data-throw-if-not-resolved="false"></xref>); this class fans out

    to multiple in-process gRPC callers. The caller-side envelope is

    <code>SubscribeResponse</code> (CloudEvent proto envelope), in

    contrast to <xref href="Virtufin.Api.Services.PubsubSubscriptionManager" data-throw-if-not-resolved="false"></xref> which also uses the

    <code>SubscribeResponse</code> envelope.
  example: []
  syntax:
    content: 'public class GatewaySubscriptionManager : SubscriptionManagerBase<SubscribeResponse, GatewaySubscription>'
    content.vb: Public Class GatewaySubscriptionManager Inherits SubscriptionManagerBase(Of SubscribeResponse, GatewaySubscription)
