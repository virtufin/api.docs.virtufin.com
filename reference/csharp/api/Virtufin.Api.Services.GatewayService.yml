  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Implementation of the gRPC Gateway service.

    Provides service discovery and method invocation. Event subscription

    (Gateway.Subscribe) was never added to gateway.proto -- Pubsub.Subscribe

    (see PubsubService) is the only subscribe path; this class previously

    held unused constructor dependencies (DaprPublishSubscribeClient,

    TopicDaprSubscriptionRegistry, GatewaySubscriptionManager) left over

    from that never-implemented design.
  example: []
