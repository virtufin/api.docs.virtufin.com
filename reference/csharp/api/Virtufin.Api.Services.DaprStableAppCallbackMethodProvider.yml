  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Serves the parts of Dapr's **stable** <code>AppCallback</code> service that the

    runtime actually calls: <code>OnJobEvent</code> (scheduled job delivery) and

    <code>ListTopicSubscriptions</code> (declarative-subscription discovery).


    <p>

    Why this exists: the Dapr runtime (confirmed on 1.18.1) delivers

    scheduled jobs to <code>AppCallback/OnJobEvent</code> — the stable service, per

    dapr/dapr's own <code>appcallback.proto</code>. The .NET SDK lags it: the

    generated code in <code>Dapr.Protos</code> 1.18.2 contains

    <code>OnJobEventAlpha1</code> on <code>AppCallbackAlpha</code> and no

    <code>OnJobEvent</code> anywhere, so

    <xref href="Virtufin.Api.Services.DaprAppCallbackService" data-throw-if-not-resolved="false"></xref> could only ever bind the alpha

    route. Nothing served the route Dapr actually calls, the request

    matched no endpoint, and it was rejected 401 by

    <code>ApiKeyHttpMiddleware</code> (which exempts only requests whose matched

    endpoint carries <code>GrpcMethodMetadata</code>). Net effect: **no scheduled

    trigger ever fired**, while Dapr retried roughly once a second forever.

    </p>


    <p>

    Registering the method here rather than regenerating

    <code>appcallback.proto</code> into this repo is deliberate: the request and

    response types already exist in <code>Dapr.Protos</code> and are reused

    as-is, so there is no second copy of the Dapr message types to collide

    with the SDK's (the CS0433 duplicate-type trap this codebase has hit

    before). Only the service/method *name* differs.

    </p>


    <p>

    Because the endpoint is produced through the normal gRPC service-model

    pipeline it carries <code>GrpcMethodMetadata</code>, so

    <code>ApiKeyHttpMiddleware</code> lets it through to

    <code>ApiKeyInterceptor</code>, which exempts the

    <code>/dapr.proto.runtime.v1.AppCallback/</code> prefix — the sidecar cannot

    present an API key.

    </p>


    <p>

    Both routes stay live: the alpha one for older runtimes, this one for

    current ones. They share a single handler, so behaviour cannot drift.

    Once the SDK generates the stable method, this provider can be replaced

    by a plain <code>override OnJobEvent</code> on

    <xref href="Virtufin.Api.Services.DaprAppCallbackService" data-throw-if-not-resolved="false"></xref>.

    </p>
