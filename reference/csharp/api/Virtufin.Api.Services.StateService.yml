    id: QueryState
    path: ../../../src/Virtufin.Api/Services/StateService.cs
    startLine: 183
  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    QueryState searches for state entries using Dapr's JSON query format.

    The query is backend-dependent; for Redis/Valkey, it supports:
      {"filter": {"PREFIX": "workmanager.worker."}}
      {"filter": {"EQ": {"key": "websocketmanager.connection.abc"}}}
      {"filter": {"OR": [{"PREFIX": "workmanager.worker."}, {"EQ": {"key": "workmanager.worker.index"}}]}}
    "{}" is Dapr's "match everything" query.


    Requires the configured state store's Dapr component to support the

    Query API. For Redis/Valkey backends (state.redis/state.valkey) this

    means the RediSearch module must be loaded and the component must

    declare `queryIndexes` metadata -- a plain Redis/Valkey component

    without those does not support Query State at all (fails even "{}"),

    and returns a generic error with no query-specific detail. If the

    configured store doesn't support querying, use GetBulkState against

    known keys instead (see the key-naming convention above).
