  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Manages one Dapr pubsub subscription per topic per API process,

    with a reference count of in-process gRPC callers sharing it.


    Per the Pub/Sub Topics spec §Subscription Implementation Pattern:

    one Dapr subscription per topic per service process — NOT one per

    gRPC call. Per-call Dapr subscriptions would cause the same event

    to be load-balanced across callers instead of broadcast to each.
  example: []
