  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Resolves gRPC server reflection requests against two descriptor sources:

    the gateway's own compiled-in protos (Gateway/Config/State/Pubsub) and the

    backend descriptor caches maintained by <xref href="Virtufin.Api.Services.GrpcReflectionService" data-throw-if-not-resolved="false"></xref>.

    This is what lets clients reflect on backend services (virtufin.WorkManager,

    virtufin.WebSocketManager, ...) through the gateway, which does not compile

    their protos in. Besides fully-qualified symbols, the registered service

    name from services.json (e.g. "workmanager") is accepted as a

    FileContainingSymbol alias for the backend's whole descriptor set.
